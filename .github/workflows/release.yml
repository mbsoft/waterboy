# Pushing a vX.Y.Z tag (node scripts/version.mjs bump X.Y.Z) builds, signs, notarizes and uploads Waterboy
# to a *draft* GitHub Release. Publishing the draft is the go-live step: that's when installed apps see
# the update. Tags with a suffix (v0.3.0-beta.1) become prereleases, which installed apps ignore.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12_BASE64   Developer ID Application certificate + key, exported as .p12, base64-encoded
#   MACOS_CERT_PASSWORD     its export password
#   APPLE_API_KEY_P8        contents of the App Store Connect API key (AuthKey_XXXX.p8)
#   APPLE_API_KEY_ID        its key ID
#   APPLE_API_ISSUER        its issuer ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: waterboy-desktop/.nvmrc
          cache: npm
          cache-dependency-path: |
            waterboy-agent/package-lock.json
            waterboy-desktop/package-lock.json
      - name: Tag matches the package versions and has CHANGELOG notes
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - name: Install
        run: |
          (cd waterboy-agent && npm ci --no-audit --no-fund)
          (cd waterboy-desktop && npm ci --no-audit --no-fund)
      - name: Notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      # scripts/release.sh: tests, helper build, staging, electron-builder (sign + notarize the app),
      # notarize + staple the DMGs, verify signatures and Gatekeeper, SHA256SUMS.txt.
      - name: Build, sign and notarize
        working-directory: waterboy-desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run release
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/version.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          cd waterboy-desktop/dist
          # latest-mac.yml + zips + blockmaps are the update feed; the DMGs are for first installs.
          gh release create "$GITHUB_REF_NAME" --draft "${prerelease[@]}" \
            --title "Waterboy ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" \
            ./*.dmg ./*.zip ./*.blockmap latest-mac.yml SHA256SUMS.txt
      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
